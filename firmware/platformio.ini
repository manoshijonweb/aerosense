; PlatformIO Project Configuration File -- Kavya / AeroSense
;
; Build:            pio run
; Build + upload:   pio run -t upload
; Serial monitor:   pio device monitor
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; The Firebase client pulls in the full TLS stack, taking the image from ~300 KB
; to ~960 KB. That still fits the stock table's 1.31 MB app slot, but only just
; -- roughly 350 KB of headroom, and enabling Firestore or Storage would spend
; it. huge_app gives the application 3 MB of the 4 MB flash instead; the trade
; is a single app slot with no room for OTA, which this device does not use.
; Switch back to default.csv if you ever want OTA updates.
board_build.partitions = huge_app.csv

; --------------------------------- Upload ------------------------------------
; This machine shows four "Standard Serial over Bluetooth" COM ports alongside
; the board, so the port is pinned rather than auto-detected. The ESP32 is the
; CP210x USB-UART bridge -- run `pio device list` and update this if Windows
; renumbers it after a replug.
upload_port  = COM6
monitor_port = COM6
upload_speed = 921600

; --------------------------------- Monitor -----------------------------------
; Matches Serial.begin(115200) in main.cpp.
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; ------------------------------- Libraries -----------------------------------
; The PMS5003 is driven directly over HardwareSerial and the MQ-2 over the ADC,
; so neither needs a library. Firebase-ESP-Client brings its own TLS handling
; and token refresh; it is only linked in because FirebaseManager.cpp uses it.
lib_deps =
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
	mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.14

; ------------------------------- Build flags ---------------------------------
build_flags =
	-Wall
	-DCORE_DEBUG_LEVEL=0
